services:

  iris-dev:
    build:
      args:
        IMAGE: containers.intersystems.com/intersystems/irishealth:latest-em
      context: iris
    container_name: ${IRIS_INSTANCE_NAME}-dev
    hostname: ${IRIS_INSTANCE_NAME}-dev
    ports:
      - ${IRIS_PORT_DEV}:1972
      - 9000-9200:9000-9200
    volumes:
      - dev_${ISC_DATA_DIRECTORY}:/${ISC_DATA_DIRECTORY}
      - dev_journal:/journal
      - dev_journal2:/journal2
      - dev_WIJ:/WIJ
      - ./iris/key/iris.key:/tmp/iris.key:ro
      - ./iris/src:/code
      - ./data:/data
      - ./merge-dev.cpf:/merge.cpf
    command: --key /tmp/iris.key
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      - ISC_DATA_DIRECTORY=/${ISC_DATA_DIRECTORY}
      - ISC_CPF_MERGE_FILE=/merge.cpf
    healthcheck:
      test: ["CMD", "iris", "session", "iris", "-U", "%SYS", "##class(%Api.Atelier).GetServer()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
  iris-prod:
    build:
      args:
        IMAGE: containers.intersystems.com/intersystems/irishealth:latest-em
      context: iris
    container_name: ${IRIS_INSTANCE_NAME}-prod
    hostname: ${IRIS_INSTANCE_NAME}-prod
    ports:
      - ${IRIS_PORT_PROD}:1972
      - 9500-9700:9500-9700
    volumes:
      - prod_${ISC_DATA_DIRECTORY}:/${ISC_DATA_DIRECTORY}
      - prod_journal:/journal
      - prod_journal2:/journal2
      - prod_WIJ:/WIJ
      - ./iris/key/iris.key:/tmp/iris.key:ro
      - ./iris/src:/code
      - ./data:/data
      - ./merge-prod.cpf:/merge.cpf
    command: --key /tmp/iris.key
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      - ISC_DATA_DIRECTORY=/${ISC_DATA_DIRECTORY}
      - ISC_CPF_MERGE_FILE=/merge.cpf
    healthcheck:
      test: ["CMD", "iris", "session", "iris", "-U", "%SYS", "##class(%Api.Atelier).GetServer()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
 
  webgateway: # Used for VS Code ObjectScript extension to connect to /api/atelier and for IRIS Administration Portal
    image: containers.intersystems.com/intersystems/webgateway:latest-em
    container_name: ${IRIS_INSTANCE_NAME}-webgateway
    depends_on:
      - iris-dev
      - iris-prod
    expose:
      - "80"
    restart: unless-stopped
    environment:
    - ISC_CSP_CONF_FILE=/webgateway/CSP.conf
    - ISC_CSP_INI_FILE=/webgateway/CSP.ini
    volumes:
    - type: bind
      source: ./webgateway
      target: /webgateway
    networks:
      - default

  nginx: # Serves the Angular app on /app/ and proxies everything else to the webgateway
    image: nginx:alpine
    container_name: ${IRIS_INSTANCE_NAME}-nginx
    depends_on:
      - webgateway
    ports:
      - ${WEBGATEWAY_PORT_HTTP}:80
      - ${WEBGATEWAY_PORT_HTTPS}:443
    volumes:
    - type: bind
      source: ./nginx/nginx.conf
      target: /etc/nginx/conf.d/default.conf
      read_only: true
    - type: bind
      source: ./iris/angular/dist/hl7-client/browser
      target: /usr/share/nginx/html/app
      read_only: true
    - type: bind
      source: ./nginx/tls.conf
      target: /etc/nginx/conf.d/tls.conf
      read_only: true
    - type: bind
      source: ./nginx/certs
      target: /etc/nginx/certs
      read_only: true
    restart: unless-stopped
    networks:
      - default
  keycloak: # Identity provider for the IRIS portal and HTTP APIs (OIDC). LOCAL DEV: start-dev, embedded H2 database.
    image: quay.io/keycloak/keycloak:26.4
    container_name: ${IRIS_INSTANCE_NAME}-keycloak
    hostname: keycloak
    command: start-dev --import-realm
    env_file:
      - path: ./keycloak/secrets.env   # generated by keycloak/init-secrets.sh (git-ignored)
        required: false
    environment:
      # One name for everybody: the "iss" claim of the tokens must be the issuer configured in IRIS, and
      # both the browser and the IRIS containers must reach it. Add "127.0.0.1 keycloak" to /etc/hosts
      # on the machine running the browser (the Docker network already resolves "keycloak").
      KC_HOSTNAME: http://keycloak:8180
      KC_HTTP_PORT: "8180"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      TZ: Europe/Paris
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-iris.json:/opt/keycloak/data/import/realm-iris.json:ro
    restart: unless-stopped
    networks:
      - default

  oauth2-proxy: # Browser login (OIDC code flow + PKCE) to Keycloak for the IRIS portal; nginx asks it via auth_request
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    container_name: ${IRIS_INSTANCE_NAME}-oauth2-proxy
    hostname: oauth2-proxy
    depends_on:
      - keycloak
    env_file:
      - path: ./keycloak/secrets.env   # OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
        required: false
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8180/realms/iris
      OAUTH2_PROXY_CLIENT_ID: iris-portal
      OAUTH2_PROXY_REDIRECT_URL: https://localhost/oauth2/callback
      OAUTH2_PROXY_SCOPE: openid profile email roles
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202          # auth only: nginx keeps proxying to the Web Gateway
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"         # X-Auth-Request-User / -Access-Token for nginx
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_COOKIE_REFRESH: 4m               # refresh before the 5 minute access token expires
      OAUTH2_PROXY_SESSION_STORE_TYPE: cookie
      OAUTH2_PROXY_COOKIE_NAME: _iris_oauth2
      TZ: Europe/Paris
    restart: unless-stopped
    networks:
      - default

  ldap: # Demo OpenLDAP for the native IRIS LDAP authentication. Reachable only on the Docker network (no published port).
    image: osixia/openldap:1.5.0
    container_name: ${IRIS_INSTANCE_NAME}-ldap
    hostname: ldap
    command: --copy-service                 # loads ldap/bootstrap/*.ldif at the first start (empty data directory)
    env_file:
      - path: ./ldap/secrets.env            # LDAP_ADMIN_PASSWORD, LDAP_CONFIG_PASSWORD, LDAP_READONLY_USER_PASSWORD (git-ignored)
        required: false
    environment:
      LDAP_ORGANISATION: IRIS Health Training
      LDAP_DOMAIN: example.org
      LDAP_BASE_DN: dc=example,dc=org
      LDAP_TLS: "false"                     # demo on the internal Docker network; use LDAPS for anything real
      LDAP_READONLY_USER: "true"            # account used by IRIS to search users and groups
      LDAP_READONLY_USER_USERNAME: readonly
      TZ: Europe/Paris
    volumes:
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - ./ldap/data:/var/lib/ldap
      - ./ldap/slapd.d:/etc/ldap/slapd.d
    restart: unless-stopped
    networks:
      - default

  postgres:
    container_name: training-postgres
    hostname: training-postgres
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgreSQL:/docker-entrypoint-initdb.d/
      - databases_postgreSQL:/var/lib/postgresql/data
    ports:
      - 5432:5432
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "pg_isready", "-U", "postgres"]
        interval: 30s
        timeout: 30s
        retries: 3
    networks:
      - default 
volumes:
  databases_postgreSQL:
    external: true
    name: ${IRIS_INSTANCE_NAME}_databases_postgreSQL
  dev_databases:
    external: true
    name: ${IRIS_INSTANCE_NAME}_dev_databases  
  dev_journal:
    external: true
    name: ${IRIS_INSTANCE_NAME}_dev_journal
  dev_journal2:
    external: true
    name: ${IRIS_INSTANCE_NAME}_dev_journal2
  dev_WIJ:
    external: true
    name: ${IRIS_INSTANCE_NAME}_dev_WIJ
  prod_databases:
    external: true
    name: ${IRIS_INSTANCE_NAME}_prod_databases
  prod_journal:
    external: true
    name: ${IRIS_INSTANCE_NAME}_prod_journal
  prod_journal2:
    external: true
    name: ${IRIS_INSTANCE_NAME}_prod_journal2
  prod_WIJ:
    external: true
    name: ${IRIS_INSTANCE_NAME}_prod_WIJ