# HTTPS front of the AWS host: Keycloak (/auth), oauth2-proxy (/oauth2), protected IRIS portal, Angular app.
# Mounted as conf.d/tls.conf by docker-compose.aws-keycloak.yml. The certificate is read through a stable link,
# /etc/letsencrypt/live/current -> <public host>, set by deploy-keycloak-aws.sh (Let's Encrypt or self-signed fallback).
# No HSTS on purpose: with the self-signed fallback it would lock browsers out. Enable it once Let's Encrypt is in place.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/current/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/current/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_tickets off;


    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
    }

    # ── Keycloak, served under /auth ───────────────────────────────────────────────────
    # The admin console and the master realm are NOT public: use an SSH tunnel to 127.0.0.1:8180 (KC_HOSTNAME_ADMIN).
    location ~ ^/auth/(admin|realms/master)(/|$) {
        return 404;
    }
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_buffer_size       16k;
        proxy_buffers           4 16k;
        proxy_busy_buffers_size 32k;
    }

    # ── Keycloak login for the IRIS portal (oauth2-proxy) ───────────────────────────────
    location ^~ /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_buffer_size       16k;
        proxy_buffers           4 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180/oauth2/auth;
        proxy_buffer_size       16k;
        proxy_buffers           4 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body off;
    }

    # Sign-in redirect for an unauthenticated portal request. The original URI is sent in the X-Auth-Request-Redirect header,
    # which oauth2-proxy uses as is. A "?rd=" query parameter would be URL-decoded once: "%25CSP.Portal.Home.zen" (the default
    # portal home page) would come back as "%CSP.Portal.Home.zen", an invalid URL answered by a 400.
    location = /_oauth2_signin {
        internal;
        proxy_pass http://oauth2-proxy:4180/oauth2/start;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Content-Length          "";
        proxy_pass_request_body off;
        proxy_buffer_size       16k;
        proxy_buffers           4 16k;
        proxy_busy_buffers_size 32k;
    }

    # Management Portal and Interoperability portal pages: Keycloak login, then the access token goes to IRIS as a bearer token.
    # HTTP services and REST/FHIR endpoints of the same web applications are not matched: they use bearer tokens directly.
    location ~ ^/(iris-health-training-(dev|prod)/)?csp/(sys(/|$)|healthshare/[^/]+/EnsPortal\.) {
        auth_request /oauth2/auth;
        error_page 401 = /_oauth2_signin;
        auth_request_set $kc_token $upstream_http_x_auth_request_access_token;

        proxy_pass http://webgateway:80;
        proxy_set_header Authorization     "Bearer $kc_token";
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://webgateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
